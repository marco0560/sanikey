name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_target:
        description: "Destinazione di pubblicazione"
        required: true
        default: none
        type: choice
        options:
          - none
          - testpypi
          - pypi
      release_tag:
        description: "Tag vX.Y.Z da pubblicare manualmente"
        required: true
        type: string

permissions:
  contents: write

jobs:
  semantic-release:
    if: github.event_name == 'push'
    name: Create semantic release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: |
          uv sync --frozen --group dev --extra docs

      - name: Validate release candidate
        run: uv run python scripts/validate_repo.py

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pinned release tooling
        run: npm ci

      - name: Create release, changelog commit, and tag
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve created release tag
        id: release
        run: |
          tag="$(git describe --exact-match --tags HEAD --match 'v[0-9]*' 2>/dev/null || true)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build package for the created release
        if: steps.release.outputs.tag != ''
        run: uv run python -m build

      - name: Validate package metadata
        if: steps.release.outputs.tag != ''
        run: uv run twine check --strict dist/*

      - name: Attach release distributions
        if: steps.release.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          files: dist/*

  build-manual:
    if: github.event_name == 'workflow_dispatch'
    name: Build selected release distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify exact release tag
        run: git describe --tags --exact-match --match "v[0-9]*"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --frozen --group dev

      - name: Build package
        run: uv run python -m build

      - name: Validate package metadata
        run: uv run twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ inputs.release_tag }}
          path: dist/
          if-no-files-found: error
          generate_release_notes: true

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'testpypi'
    needs: build-manual
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ inputs.release_tag }}
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'workflow_dispatch' && inputs.publish_target == 'pypi'
    needs: build-manual
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-${{ inputs.release_tag }}
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
